server: { port: 8081 }
spring:
  application: { name: property-service }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/primehaven_property?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${PRIMEHAVEN_DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PRIMEHAVEN_DB_PASSWORD:Mohan@9182387577}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
